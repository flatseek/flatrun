name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        # setuptools is required by the build backend (pyproject.toml
        # uses setuptools.build_meta). --no-build-isolation requires it
        # in the host env; install it explicitly so the editable
        # install below can resolve the backend.
        run: |
          python -m pip install --upgrade pip
          pip install build pybind11 setuptools
      - name: Build sdist (with bundled native source)
        # We only upload the sdist to PyPI. The raw "linux_x86_64"
        # wheel tag produced by `python -m build` is rejected by
        # PyPI — it expects a manylinux-compliant wheel produced by
        # auditwheel inside a manylinux docker. The sdist ships
        # the C++ source alongside the Python package, so
        # `pip install flatrun` on the user's machine uses the
        # host's pybind11 + compiler to build the native extension
        # at install time. A future change can switch to
        # cibuildwheel for proper manylinux wheels.
        run: |
          rm -rf dist/ build/
          pip install --no-build-isolation -e ".[native]"
          python -m build --sdist
      - name: Publish sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
