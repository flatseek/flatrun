name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        # setuptools is required by the build backend (pyproject.toml
        # uses setuptools.build_meta). --no-build-isolation requires it
        # in the host env; install it explicitly so the editable
        # install below can resolve the backend.
        run: |
          python -m pip install --upgrade pip
          pip install build pybind11 setuptools
      - name: Build sdist + wheel (with native extension)
        run: |
          rm -rf dist/ build/
          pip install --no-build-isolation -e ".[native]"
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
