[project]
name = "flatrun"
version = "0.1.2"
description = "The streaming inference runtime for open-weight LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Judotens Budiarto", email = "judotens@flatseek.io" }
]
keywords = [
    "llm",
    "inference",
    "runtime",
    "mmap",
    "safetensors",
    "memory-efficient",
    "gguf",
    "quantization",
    "streaming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
# Optional. Used only by ``SafetensorsLibBackend``; the default Flatrun
# SafeTensors backend does its own parsing and has no third-party deps.
safetensors = [
    "safetensors>=0.4.0",
]
# Optional. Pulls in pybind11 to compile the C++ extension. The base
# install works without this; the extension is only built when the
# extra is requested.
native = [
    "pybind11>=2.10",
]
# Optional. Required by ``flatrun serve`` — installs FastAPI + uvicorn
# for the OpenAI / Anthropic-compatible HTTP server. The base install
# deliberately does not depend on these so a wheel used for embedded
# inference (or in a serverless container without an HTTP listener)
# stays light.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://flatseek.io"
Documentation = "https://flatseek.io/docs"
Repository = "https://github.com/flatseek/flatrun"
Issues = "https://github.com/flatseek/flatrun/issues"

Flatlens = "https://github.com/flatseek/flatlens"
Flatvec = "https://github.com/flatseek/flatvec"
Flatask = "https://github.com/flatseek/flatask"
Flattune = "https://github.com/flatseek/flattune"

Benchmarks = "https://github.com/flatseek/flatbench"

[project.scripts]
flatrun = "flatrun.cli:main"
flatrun-bench = "flatrun.benchmark.bench:main"

[build-system]
requires = ["setuptools>=68", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flatrun*"]

[tool.setuptools.package-data]
"flatrun_native" = ["**/*.h", "kernels/*.h"]

[tool.pytest.ini_options]
testpaths = ["src/flatrun/tests", "src/flatrun_native/tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: download a real model from HuggingFace. Skipped in CI; run locally with `pytest -m network`.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
