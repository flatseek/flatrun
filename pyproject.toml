[project]
name = "flatrun"
version = "0.1.0"
description = "Streaming inference runtime for LLMs that don't fit in RAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Flatrun Contributors" },
]
keywords = [
    "llm",
    "inference",
    "runtime",
    "mmap",
    "safetensors",
    "memory-efficient",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
# Optional. Used only by ``SafetensorsLibBackend``; the default Flatrun
# SafeTensors backend does its own parsing and has no third-party deps.
safetensors = [
    "safetensors>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/tenslab/flatrun"
Documentation = "https://github.com/tenslab/flatrun/blob/main/docs"
Issues = "https://github.com/tenslab/flatrun/issues"

[project.scripts]
flatrun = "flatrun.cli:main"
flatrun-bench = "flatrun.benchmark.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatrun"]

[tool.hatch.build.targets.sdist]
include = [
    "src/flatrun",
    "README.md",
    "docs",
    "examples",
]

[tool.pytest.ini_options]
testpaths = ["src/flatrun/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true